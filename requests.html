<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>バンド申請</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-page="requests">
    <header class="site-header">
      <div>
        <p class="eyebrow">Band Request</p>
        <h1>バンド申請</h1>
      </div>
      <a class="text-link" href="index.html">ポータルへ</a>
    </header>

    <main class="narrow-page">
      <section class="panel">
        <h2>申請フォーム</h2>
        <p class="hint" id="requestUserLabel"></p>
        <form id="bandRequestForm">
          <label>申請種別
            <select name="requestType" required>
              <option value="create">新規作成</option>
              <option value="update_members">メンバー変更</option>
              <option value="dissolve">解散</option>
            </select>
          </label>
          <label>バンド名<input name="bandName" required></label>
          <label>メンバー情報<textarea name="membersText" placeholder="例: s240001,山田 太郎&#10;s240002,佐藤 花子"></textarea></label>
          <p class="hint">1行につき1名。「学籍番号,氏名」または「学籍番号 氏名」で入力してください。解散申請では空欄で構いません。</p>
          <label>申請理由<textarea name="reason"></textarea></label>
          <button type="submit">申請する</button>
        </form>
        <div class="message" id="requestMessage"></div>
      </section>
    </main>
  </body>
</html>
