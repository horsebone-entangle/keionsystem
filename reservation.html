<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音楽室予約</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
    <meta name="description" content="軽音楽部の音楽室予約・バンド申請・部員管理">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  </head>
  <body data-page="reservation">
    <header class="site-header">
      <div>
        <p class="eyebrow">Reservation</p>
        <h1>音楽室予約</h1>
      </div>
      <a class="text-link" href="index.html">ポータルへ</a>
    </header>

    <main class="page-grid">
      <section class="panel schedule-panel">
        <div class="section-head">
          <div>
            <h2>14日間予約カレンダー</h2>
            <p id="monthLabel"></p>
          </div>
          <div class="month-controls">
            <button type="button" id="prevMonth" aria-label="前の日">前の日</button>
            <button type="button" id="todayButton">今日</button>
            <button type="button" id="nextMonth" aria-label="次の日">次の日</button>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="legend">
          <span><i class="available"></i>予約可能</span>
          <span><i class="closed"></i>予約不可</span>
          <span><i class="booked"></i>予約済み</span>
        </div>
      </section>

      <aside class="panel side-panel">
        <h2>予約フォーム</h2>
        <p class="hint" id="reservationUserLabel"></p>
        <form id="reservationForm">
          <label>
            予約方法
            <select name="reservationType" id="reservationType">
              <option value="band">バンド</option>
              <option value="personal">個人</option>
            </select>
          </label>
          <label>日付<input type="date" name="date" id="reservationDate" required></label>
          <label>コマ<select name="slotId" id="slotSelect" required></select></label>
          <div class="selected-slot" id="selectedSlotSummary">カレンダーから日付とコマを選べます。</div>
          <div class="quota-box" id="reservationQuota"></div>
          <label id="bandNameField">バンド名<input name="bandName" list="bandOptions" placeholder="例: 放課後コード"></label>
          <datalist id="bandOptions"></datalist>
          <button type="submit">予約する</button>
        </form>
        <div class="message" id="reservationMessage"></div>

        <section class="my-reservations">
          <h3>自分の予約</h3>
          <div id="myReservations"></div>
        </section>
      </aside>
    </main>
  </body>
</html>
