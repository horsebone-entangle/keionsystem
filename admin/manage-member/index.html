<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約管理</title>
    <link rel="stylesheet" href="../../styles.css">
    <script defer src="../../app.js"></script>
    <meta name="description" content="軽音楽部の音楽室予約・バンド申請・部員管理">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  </head>
  <body data-page="admin">
    <header class="site-header">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>予約管理</h1>
      </div>
      <a class="text-link" href="../../index.html">ポータルへ</a>
    </header>

    <main class="admin-page">
      <section class="admin-content" id="adminContent">
        <div class="admin-toolbar">
          <strong id="adminName"></strong>
          <button type="button" class="secondary" id="adminLogout">ログアウト</button>
        </div>

        <form id="settingsForm" class="panel">
          <h2>予約制約</h2>
          <label>個人予約できる日数<input type="number" name="personalOpenDays" min="0" max="13" required></label>
          <label>バンド月上限<input type="number" name="monthlyBandLimit" min="0" max="999" required></label>
          <label>個人月上限<input type="number" name="monthlyPersonalLimit" min="0" max="999" required></label>
          <button type="submit">保存</button>
          <div class="message" role="status"></div>
        </form>

        <section class="panel">
          <div class="section-head">
            <div>
              <h2>使用可否編集</h2>
              <p>現在から半年分まで、日付とコマごとに使用可否を変更できます。</p>
            </div>
            <div class="month-controls">
              <button type="button" id="availabilityPrev">前の月</button>
              <button type="button" id="availabilityToday">今月</button>
              <button type="button" id="availabilityNext">次の月</button>
            </div>
          </div>
          <p class="hint" id="availabilityMonthLabel"></p>
          <div class="availability-month" id="availabilityMonth"></div>
          <div class="slot-editor hidden" id="slotEditor">
            <h3 id="slotEditorTitle"></h3>
            <div class="slot-toggle-grid" id="slotEditorGrid"></div>
          </div>
        </section>

        <section class="panel">
          <h2>曜日・コマのデフォルト</h2>
          <p class="hint">通常開放する曜日とコマを設定します。個別日の設定がある場合はそちらが優先されます。</p>
          <div class="default-slot-editor" id="defaultSlotEditor"></div>
          <button type="button" id="saveDefaultSlots">デフォルトを保存</button>
          <div class="message" id="defaultSlotMessage"></div>
        </section>

        <section class="panel">
          <h2>月間利用状況</h2>
          <div class="table-scroll">
            <table>
              <thead><tr><th>区分</th><th>名前</th><th>コマ数</th></tr></thead>
              <tbody id="usageTable"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
