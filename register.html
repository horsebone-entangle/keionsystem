<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body data-page="register">
    <header class="site-header">
      <div>
        <p class="eyebrow">Sign Up</p>
        <h1>新規登録</h1>
      </div>
      <a class="text-link" href="index.html">ポータルへ</a>
    </header>

    <main class="narrow-page">
      <section class="panel">
        <h2>アカウント作成</h2>
        <form id="registerForm">
          <label>学籍番号<input name="studentId" autocomplete="username" required></label>
          <label>氏名<input name="name" required></label>
          <label>パスワード<input type="password" name="password" autocomplete="new-password" required></label>
          <button type="submit">登録する</button>
        </form>
        <p class="hint">学籍番号が部員データベースに登録されていない場合は登録できません。</p>
        <div class="message" id="registerMessage"></div>
      </section>
    </main>
  </body>
</html>
