<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
    <meta name="description" content="軽音楽部の音楽室予約・バンド申請・部員管理">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  </head>
  <body data-page="register">
    <header class="site-header">
      <div>
        <p class="eyebrow">Sign Up</p>
        <h1>新規登録</h1>
      </div>
      <a class="text-link" href="index.html">ポータルへ</a>
    </header>

    <main class="narrow-page">
      <section class="panel">
        <h2>アカウント作成</h2>
        <form id="registerForm">
          <label>学籍番号<input name="studentId" autocomplete="username" required></label>
          <label>招待コード<input name="invitationCode" autocomplete="off" required></label>
          <label>氏名<input name="name" required></label>
          <label>パスワード<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
          <button type="submit">登録する</button>
        </form>
        <p class="hint">管理者から受け取った招待コードと登録済みの氏名を入力してください。パスワードは10文字以上です。</p>
        <div class="message" id="registerMessage"></div>
      </section>
    </main>
  </body>
</html>
